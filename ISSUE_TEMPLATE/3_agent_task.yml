name: "Agent Task"
description: "Implementation task, usually generated by the agent from a Feature."
title: "[TASK] "
body:
  - type: markdown
    attributes:
      value: |
        ## Agent Task

        This is a concrete implementation unit.
        It should normally map to one focused PR.

  - type: input
    id: parent_feature
    attributes:
      label: "Parent Feature"
      placeholder: "#124"
    validations:
      required: true

  - type: textarea
    id: task_goal
    attributes:
      label: "Task goal"
      placeholder: |
        What should be changed?
    validations:
      required: true

  - type: textarea
    id: implementation_notes
    attributes:
      label: "Implementation notes"
      placeholder: |
        - Relevant files/directories
        - Constraints
        - Existing patterns to follow
    validations:
      required: true

  - type: textarea
    id: task_acceptance_criteria
    attributes:
      label: "Task acceptance criteria"
      placeholder: |
        - Criteria 1
        - Criteria 2
        - Existing tests pass
    validations:
      required: true

  - type: textarea
    id: test_requirements
    attributes:
      label: "Test requirements"
      placeholder: |
        - Add unit tests
        - Add integration tests if needed
        - Run CI-relevant checks
    validations:
      required: true

  - type: dropdown
    id: task_size
    attributes:
      label: "Task size"
      options:
        - "XS - one small change"
        - "S - focused change"
        - "M - multi-file change"
        - "L - should probably be split"
    validations:
      required: true

  - type: dropdown
    id: allowed_model_tier
    attributes:
      label: "Allowed model tier"
      options:
        - "Cheap only"
        - "Standard allowed"
        - "Premium allowed if blocked"
    validations:
      required: true

  - type: checkboxes
    id: task_guardrails
    attributes:
      label: "Task guardrails"
      options:
        - label: "Do not push directly to main"
          required: true
        - label: "Open a PR for review"
          required: true
        - label: "Run relevant tests before PR"
          required: true
        - label: "Stop and mark blocked if requirements are ambiguous"
          required: true