name: "Epic"
description: "Top-level business-owned initiative. Trigger agent planning from here."
title: "[EPIC] "
type: "Epic"
body:
  - type: markdown
    attributes:
      value: |
        ## Epic

        This is the top-level business-owned item.

        Intended hierarchy:

        Epic
        └── Feature
            └── Task
                └── PR

        Create Feature issues separately and add them as sub-issues under this Epic.
        Add `agent:ready` only when this Epic is ready for agent planning.

  - type: textarea
    id: business_goal
    attributes:
      label: "Business goal"
      description: "What business outcome should this Epic achieve?"
      placeholder: |
        Example:
        Give users a dashboard for monitoring competitor campaigns across retailers.
    validations:
      required: true

  - type: textarea
    id: user_value
    attributes:
      label: "User value"
      description: "Who benefits, and what can they do after this Epic is delivered?"
      placeholder: |
        As a retail analyst, I can...
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: "In scope"
      placeholder: |
        - Feature A
        - Feature B
        - Feature C
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: "Out of scope"
      placeholder: |
        - Do not change authentication
        - Do not add payment logic
    validations:
      required: true

  - type: textarea
    id: feature_breakdown
    attributes:
      label: "Feature breakdown"
      description: "List linked Feature issues that belong under this Epic."
      placeholder: |
        - #123 Campaign detection logic
        - #124 Campaign dashboard
        - #125 Campaign drilldown
    validations:
      required: true

  - type: textarea
    id: epic_acceptance_criteria
    attributes:
      label: "Epic acceptance criteria"
      placeholder: |
        - All linked Features are completed
        - All generated Tasks have passing CI
        - The implementation is documented
        - No direct push to main
    validations:
      required: true

  - type: dropdown
    id: autonomy_level
    attributes:
      label: "Allowed agent autonomy"
      options:
        - "Plan only"
        - "Create tasks only"
        - "Create tasks and PRs"
        - "Create tasks, PRs, and update hierarchy"
    validations:
      required: true

  - type: dropdown
    id: model_budget
    attributes:
      label: "Model budget"
      options:
        - "XS - cheap models only"
        - "S - cheap default, standard fallback"
        - "M - standard allowed"
        - "L - premium allowed with approval"
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: "Risk level"
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: true

  - type: textarea
    id: technical_constraints
    attributes:
      label: "Technical constraints"
      placeholder: |
        - Do not modify .env files
        - All changes must go through PR
        - Run relevant tests
    validations:
      required: true

  - type: checkboxes
    id: readiness_checklist
    attributes:
      label: "Epic readiness checklist"
      options:
        - label: "Business goal is clear"
          required: true
        - label: "Features are created and linked as sub-issues"
          required: true
        - label: "Acceptance criteria are clear"
          required: true
        - label: "Out-of-scope items are documented"
          required: true
        - label: "Agent autonomy level is selected"
          required: true
        - label: "Risk level and model budget are selected"
          required: true