name: "Bug"
description: "Defect or regression."
title: "[BUG] "
body:
  - type: textarea
    id: bug_summary
    attributes:
      label: "Bug summary"
      placeholder: |
        What is wrong?
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "Expected behavior"
      placeholder: |
        What should happen?
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: "Actual behavior"
      placeholder: |
        What actually happens?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: suspected_area
    attributes:
      label: "Suspected area"
      placeholder: |
        Optional: file, module, service, or component
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options:
        - "Low"
        - "Medium"
        - "High"
        - "Critical"
    validations:
      required: true