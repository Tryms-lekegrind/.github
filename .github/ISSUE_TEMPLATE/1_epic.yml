name: "Epic"
description: "Top-level business-owned initiative."
title: "[EPIC] "
type: "Epic"
body:
  - type: markdown
    attributes:
      value: |
        ## Epic

        Describe the business goals, user value, and acceptance criteria for this Epic.

  - type: textarea
    id: business_goal
    attributes:
      label: "Business goal"
      description: "What business outcome should this Epic achieve?"
      placeholder: "Example: Give users a dashboard for monitoring campaigns."
    validations:
      required: true

  - type: textarea
    id: user_value
    attributes:
      label: "User value"
      description: "Who benefits, and what can they do after this Epic is delivered?"
      placeholder: "As a retail analyst, I can..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance criteria"
      placeholder: |
        - All linked Features are completed
        - All generated Tasks have passing CI
        - The implementation is documented
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: "Risk level"
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: false

  - type: dropdown
    id: model_budget
    attributes:
      label: "Model budget"
      options:
        - "XS - cheap models only"
        - "S - cheap default, standard fallback"
        - "M - standard allowed"
        - "L - premium allowed with approval"
    validations:
      required: false