name: "Feature"
description: "Business-owned capability under an Epic."
title: "[FEATURE] "
type: "Feature"
body:
  - type: markdown
    attributes:
      value: |
        ## Feature

        A Feature belongs under an Epic.

  - type: input
    id: parent_epic
    attributes:
      label: "Parent Epic"
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: feature_goal
    attributes:
      label: "Feature goal"
      placeholder: "What should this Feature achieve?"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance criteria"
      placeholder: |
        - Criteria 1
        - Criteria 2
        - Criteria 3
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: "Risk level"
      options:
        - "Low"
        - "Medium"
        - "High"
    validations:
      required: false